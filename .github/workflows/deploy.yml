# Test, build and deploy the site to GitHub Pages.
#
# - Pull requests to main: run tests + build only (nothing is published).
# - Push to main (or manual "Run workflow"): test, build, then deploy.
# A failing test or build stops the run before anything is deployed.
#
# One-time setup: repo Settings → Pages → Build and deployment → Source:
# "GitHub Actions" (instead of "Deploy from a branch").
name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time. Don't cancel an in-progress deploy, so a
# half-finished publish is never interrupted; queued runs wait their turn.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          # Matches local development (Vite 6 / Vitest 3 support Node 18, 20, 22+).
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
